<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & neutrals" subtitle="Warm cream base — never stark white" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:16px;background:#fff">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div style="border-radius:10px;overflow:hidden;border:1px solid var(--border-subtle)"><div style="height:70px;background:var(--surface-page)"></div><div style="padding:6px 10px;font-size:12px"><b>Page</b> #FAF6F0</div></div>
<div style="border-radius:10px;overflow:hidden;border:1px solid var(--border-subtle)"><div style="height:70px;background:var(--surface-card-warm)"></div><div style="padding:6px 10px;font-size:12px"><b>Card warm</b> #FBF6EC</div></div>
<div style="border-radius:10px;overflow:hidden;border:1px solid var(--border-subtle)"><div style="height:70px;background:var(--cream-deep)"></div><div style="padding:6px 10px;font-size:12px"><b>Cream deep</b> #F3ECE1</div></div>
<div style="border-radius:10px;overflow:hidden;border:1px solid var(--border-subtle)"><div style="height:70px;background:var(--surface-inverse)"></div><div style="padding:6px 10px;font-size:12px"><b>Inverse</b> #1E3148</div></div>
</div></body></html>
