<!-- @dsCard group="Brand" viewport="700x190" name="Iconography" subtitle="Flat line icons (Lucide) — 3D renders excluded from campaign" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script></head>
<body style="margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)">
<div style="display:flex;gap:20px;align-items:center">
<div style="display:flex;gap:12px">
<div style="width:56px;height:56px;border-radius:14px;background:var(--teal-100);display:flex;align-items:center;justify-content:center;color:var(--teal-700)"><i data-lucide="messages-square"></i></div>
<div style="width:56px;height:56px;border-radius:14px;background:var(--teal-100);display:flex;align-items:center;justify-content:center;color:var(--teal-700)"><i data-lucide="calendar-clock"></i></div>
<div style="width:56px;height:56px;border-radius:14px;background:var(--teal-100);display:flex;align-items:center;justify-content:center;color:var(--teal-700)"><i data-lucide="users"></i></div>
<div style="width:56px;height:56px;border-radius:14px;background:var(--teal-100);display:flex;align-items:center;justify-content:center;color:var(--teal-700)"><i data-lucide="book-open"></i></div>
</div>
<div style="display:flex;gap:10px;align-items:center;opacity:.85">
<img src="../assets/illustrations/3d-speech-bubbles.png" alt="3D render — do not use on campaign" style="width:52px;height:52px;object-fit:contain;filter:grayscale(.4)">
<span style="font-size:13px;color:var(--text-muted);max-width:200px">3D renders = "gamified app" language. Off-limits for this campaign.</span>
</div>
</div>
<script>lucide.createIcons({attrs:{width:26,height:26,'stroke-width':1.8}})</script>
</body></html>
