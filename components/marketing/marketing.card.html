};

<div style={{display:'flex',flexDirection:'column',gap:24}}>

  <FAQAccordion items={[{q:'What does unlimited actually mean?',a:'Live sessions Monday to Friday, 7 AM to 10 PM COT — join as many as you want.'},{q:'What happens after month one?',a:"You'll see a special offer to continue at checkout."}]}/>
