<!-- @dsCard group="Spacing" viewport="700x160" name="Radii & shadows" subtitle="8/14/20/pill · soft navy-tinted shadows" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)">
<div style="display:flex;gap:16px;align-items:center">
<div style="width:90px;height:90px;background:#fff;border-radius:var(--radius-sm);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;font-size:12px">8px</div>
<div style="width:90px;height:90px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;font-size:12px">14px</div>
<div style="width:90px;height:90px;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;font-size:12px">20px</div>
<div style="height:48px;padding:0 24px;background:#fff;border-radius:var(--radius-pill);box-shadow:var(--shadow-card);display:flex;align-items:center;font-size:12px">pill</div>
<div style="height:48px;padding:0 24px;background:var(--accent-cta);color:#fff;border-radius:var(--radius-pill);box-shadow:var(--shadow-cta);display:flex;align-items:center;font-size:12px">CTA glow</div>
</div></body></html>
